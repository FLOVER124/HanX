<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>HanX PDF</title><link rel="stylesheet" href="editor.css"></head><body>
<header><b class="brand">HanX <small>문서</small></b><span id="filename"></span><button id="undo" title="실행 취소">↶</button><button id="redo" title="다시 실행">↷</button><button id="save">저장</button><button id="saveAs" class="primary">복사본 저장</button></header>
<nav aria-label="문서 도구"><button id="documentMode">문서로 편집</button><span class="divider"></span><button id="addText">텍스트 추가</button><button id="addImage">이미지 추가</button><button id="addRect">도형 추가</button><span class="divider"></span><button id="editText">텍스트 수정</button><button id="replaceImage">이미지 교체</button><button id="delete">삭제</button><span class="divider"></span><button id="ocr">문자 인식</button><select id="zoom" aria-label="확대"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></nav>
<main><aside class="pages"><h2>페이지</h2><div id="pages"></div></aside><section id="workspace" aria-label="PDF 페이지"><div id="paper" tabindex="0"><img id="preview" alt="PDF 페이지"><div id="objects"></div></div></section><aside class="properties"><h2>개체</h2><div id="objectList"></div><div id="inspector" hidden><h2>크기와 위치</h2><div class="fields"><label>X<input id="x" type="number" step="1"></label><label>Y<input id="y" type="number" step="1"></label><label>너비<input id="width" type="number" min="1" step="1"></label><label>높이<input id="height" type="number" min="1" step="1"></label></div><button id="applyGeometry">적용</button><div class="rotate"><button id="rotateLeft">↶ 90°</button><button id="rotateRight">↷ 90°</button></div><label class="color">채우기<input id="fill" type="color"></label></div></aside></main>
<footer><span id="status" role="status">준비 중…</span><span id="pageCount"></span></footer>
<dialog id="dialog"><form method="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialog-actions"><button id="cancel" type="button" value="cancel">취소</button><button id="confirm" value="confirm" class="primary">확인</button></div></form></dialog>
<script src="editor.js"></script></body></html>
