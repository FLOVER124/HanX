<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>HanX PDF</title><link rel="stylesheet" href="editor.css"></head><body>
<header><b class="brand">HanX <small>문서</small></b><span id="filename"></span><button id="undo" title="실행 취소">↶</button><button id="redo" title="다시 실행">↷</button><button id="print" title="인쇄 (⌘/Ctrl+P)">인쇄</button><button id="save">저장</button><button id="saveAs" class="primary">복사본 저장</button></header>
<nav aria-label="문서 도구"><button id="documentMode">문서로 편집</button><span class="divider"></span><button id="addText">텍스트 추가</button><button id="addImage">이미지 추가</button><button id="addRect">도형 추가</button><span class="divider"></span><button id="highlight" title="선택한 텍스트에 형광펜 주석">형광펜</button><button id="addNote" title="메모 주석 추가">메모</button><span class="divider"></span><button id="editText">텍스트 수정</button><button id="editParagraph" title="여러 줄을 한 문단으로 수정하고 원래 폭에 맞춰 다시 배치">문단 편집</button><button id="replaceImage">이미지 교체</button><button id="delete">삭제</button><span class="divider"></span><button id="find" title="현재 페이지에서 찾기 (⌘/Ctrl+F)">찾기</button><button id="ocr">문자 인식</button><select id="zoom" aria-label="확대"><option value="page">페이지 맞춤</option><option value="width">너비 맞춤</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></nav>
<section id="findBar" hidden aria-label="현재 페이지에서 찾기"><input id="findQuery" type="search" placeholder="현재 페이지에서 찾기" aria-label="현재 페이지에서 찾기"><span id="findCount" role="status"></span><button id="findPrevious" aria-label="이전 검색 결과">↑</button><button id="findNext" aria-label="다음 검색 결과">↓</button><button id="findClose" aria-label="찾기 닫기">×</button></section><main><aside class="pages"><h2 title="썸네일을 끌어 순서를 바꾸거나 오른쪽 클릭으로 회전·복제·삭제·삽입합니다">페이지</h2><div id="pages"></div></aside><section id="workspace" aria-label="PDF 페이지"><div id="paper" tabindex="0"><img id="preview" alt="PDF 페이지"><div id="objects"></div><div id="annotationLayer"></div><div id="selectionFrame" hidden></div></div></section><aside class="properties"><h2>개체</h2><select id="objectType" aria-label="개체 종류"><option value="all">모든 개체</option><option value="text">텍스트</option><option value="image">이미지</option><option value="outline">윤곽선 글자</option><option value="path">도형</option><option value="form">그룹</option></select><label class="details-toggle"><input id="showDetails" type="checkbox"> 세부 선 조각 보기</label><div id="objectList"></div><h2 id="annotationHeading" hidden>주석·양식</h2><div id="annotationList"></div><div id="annotInspector" hidden></div><div id="inspector" hidden><h2>크기와 위치</h2><div class="fields"><label>X<input id="x" type="number" step="1"></label><label>Y<input id="y" type="number" step="1"></label><label>너비<input id="width" type="number" min="1" step="1"></label><label>높이<input id="height" type="number" min="1" step="1"></label></div><button id="applyGeometry">적용</button><div class="rotate"><button id="rotateLeft">↶ 90°</button><button id="rotateRight">↷ 90°</button></div><label class="color">채우기<input id="fill" type="color"></label></div></aside></main>
<footer><span id="status" role="status">준비 중…</span><div class="page-controls"><button id="previousPage" aria-label="이전 페이지">‹</button><label><input id="pageNumber" type="number" min="1" aria-label="페이지 번호"></label><span id="pageCount"></span><button id="nextPage" aria-label="다음 페이지">›</button></div></footer>
<dialog id="dialog"><form method="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="dialog-actions"><button id="cancel" type="button" value="cancel">취소</button><button id="confirm" value="confirm" class="primary">확인</button></div></form></dialog>
<div id="contextMenu" role="menu" aria-label="개체 메뉴" hidden></div>
<script src="outlines.js"></script><script src="geometry.js"></script><script src="pages.js"></script><script src="paragraph.js"></script><script src="annotations.js"></script><script src="editor.js"></script></body></html>
