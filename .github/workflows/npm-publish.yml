name: Publish npm package
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published GitHub release version to publish to npm (for example 2.13.5)
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; no token is stored in this repository.
      - run: npm install -g npm@^11.5.1
      - name: Download the verified tarball from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          tag="v$VERSION"
          file="flover124-hanx-$VERSION.tgz"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          [[ "$(jq -r .draft <<<"$release")" == false ]] || { echo "Release $tag is not published"; exit 1; }
          digest=$(jq -r --arg f "$file" '.assets[] | select(.name == $f) | .digest' <<<"$release")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing server checksum for $file"; exit 1; }
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$file"
          echo "${digest#sha256:}  $file" | sha256sum -c -
          tar -xzOf "$file" package/package.json | jq -e --arg v "$VERSION" '.name == "@flover124/hanx" and .version == $v' >/dev/null
          echo "TARBALL=$file" >> "$GITHUB_ENV"
      - name: Publish
        run: npm publish "./$TARBALL" --access public --provenance
